<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>Pulse</title><script src="ld.js"></script><script src="ld-widgets.js"></script></head>
<body><canvas id="c"></canvas>
<script>
/* 最省电的一款：只有几十次绘制调用，适合电池模式 / 长时间挂机 */
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
let W=0,H=0;
function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
addEventListener('resize', resize); resize();

__ld.loop((t, th, st) => {
  const cx=W/2, cy=H/2, R=Math.hypot(W,H)/2;
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0, __ld.css(__ld.lerp ? th.bg : th.bg));
  g.addColorStop(1, '#000');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 同心波纹：波数与速度由状态驱动
  ctx.lineWidth = 1.1;
  for (let i=0;i<9;i++){
    const u = ((t*0.16 + i/9) % 1);
    const r = u * R * 0.92;
    const fade = Math.sin(u*Math.PI);
    ctx.strokeStyle = __ld.css(th.a, fade*0.26*(0.3+th.energy));
    ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.stroke();
  }

  // 中心核：等你输入时呼吸最明显
  const breathe = 0.5 + 0.5*Math.sin(t*2.0);
  const core = 26 + th.pulse*26*breathe;
  const cg = ctx.createRadialGradient(cx,cy,0,cx,cy,core*3.4);
  cg.addColorStop(0, __ld.css(th.a, .85*(0.3+th.energy)));
  cg.addColorStop(.35, __ld.css(th.b, .22*th.energy));
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(cx,cy,core*3.4,0,6.2832); ctx.fill();

  // 细网格，给"现代/技术感"一点结构
  ctx.strokeStyle = __ld.css(th.a, .045);
  ctx.lineWidth = 1;
  const step = 96;
  ctx.beginPath();
  for (let x=cx%step; x<W; x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
  for (let y=cy%step; y<H; y+=step){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
  ctx.stroke();
  const liteHi = c => c.map(v => Math.round(v + (255 - v) * 0.65));
  __ldWidgets.draw(st, { key: th.a, hi: liteHi(th.b) });
});
</script></body></html>
